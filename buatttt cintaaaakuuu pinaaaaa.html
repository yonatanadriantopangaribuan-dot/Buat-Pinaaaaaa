<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Particle Love Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Matrix background characters
        const matrixChars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz@#$%^&*()';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff3366';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // Particle Text System
        class Particle {
            constructor(x, y) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.originX = x;
                this.originY = y;
                this.size = 2;
                this.vx = (Math.random() - 0.5) * 20;
                this.vy = (Math.random() - 0.5) * 20;
                this.ease = 0.1;
            }

            draw() {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                let dx = this.originX - this.x;
                let dy = this.originY - this.y;
                this.x += dx * this.ease;
                this.y += dy * this.ease;
            }
        }

        let particles = [];

        function createTextParticles(text) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 120px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const textData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            particles = [];

            // Sampling pixel untuk dijadikan partikel (mengatur kerapatan titik)
            const gap = 6; 
            for (let y = 0; y < textData.height; y += gap) {
                for (let x = 0; x < textData.width; x += gap) {
                    const index = (y * textData.width + x) * 4;
                    const alpha = textData.data[index + 3];
                    if (alpha > 128) {
                        particles.push(new Particle(x, y));
                    }
                }
            }
        }

        // Urutan teks yang akan muncul
        const steps = [
            { text: "3", duration: 1500 },
            { text: "2", duration: 1500 },
            { text: "1", duration: 1500 },
            { text: "sayang", duration: 2500 },
            { text: "jangan", duration: 2500 },
            { text: "sedih", duration: 2500 },
            { text: "terus", duration: 2500 },
            { text: "dong", duration: 2500 },
            { text: "nanti", duration: 2500 },
            { text: "manisnya", duration: 2500 },
            { text: "hilang", duration: 2500 },
            { text: "aku", duration: 2500 },
            { text: "sayang", duration: 2500 },
            { text: "kamu", duration: 2500 },
            { text: "you are", duration: 2500 },
            { text: "My", duration: 2500 },
            { text: "Love", duration: 2500 },
            { text: "I Love You Sayang", duration: 5000 }
        ];

        let currentStep = 0;

        function runParticleSequence() {
            if (currentStep < steps.length) {
                createTextParticles(steps[currentStep].text);
                setTimeout(() => {
                    currentStep++;
                    runParticleSequence();
                }, steps[currentStep].duration);
            }
        }

        // Loop Utama Animasi
        function animate() {
            drawMatrix();
            
            // Gambar dan update partikel teks di atas matriks
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Mulai animasi
        animate();
        setTimeout(runParticleSequence, 500);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
